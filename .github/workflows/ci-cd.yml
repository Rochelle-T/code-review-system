name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 services --max-line-length=120 --exclude=services/code-analysis/samples
      - name: Unit tests
        run: pytest -v

  build-and-push:
    name: Build and push ${{ matrix.service }}
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth-service, webhook-listener, code-analysis, notification-service, report-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image owner (required by ghcr.io)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/crs-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/crs-${{ matrix.service }}:latest

  # Optional: deploys to the minikube cluster on your laptop through a self-hosted runner.
  # Enable by adding a repository variable ENABLE_DEPLOY = true (Settings > Secrets and variables > Actions > Variables).
  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    if: github.event_name != 'pull_request' && vars.ENABLE_DEPLOY == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build images inside minikube
        run: ./scripts/build-images.sh
      - name: Apply manifests and roll out
        run: |
          kubectl apply -f k8s/
          kubectl -n code-review-system rollout restart deployment auth-service webhook-listener \
            code-analysis notification-service report-service frontend gateway
          for d in $(kubectl -n code-review-system get deployments -o name); do
            kubectl -n code-review-system rollout status "$d" --timeout=240s
          done
