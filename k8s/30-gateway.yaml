# API Gateway: single entry point. Routes requests and checks JWTs with the Auth Service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: code-review-system
data:
  nginx.conf: |
    events {}
    http {
      client_max_body_size 10m;
      log_format main '$remote_addr "$request" $status $request_time';
      access_log /dev/stdout main;

      server {
        listen 80;

        # Internal sub-request: asks the Auth Service whether the JWT is valid.
        location = /_auth {
          internal;
          proxy_pass http://auth-service:8000/api/auth/verify;
          proxy_method GET;
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header Authorization $http_authorization;
        }

        location /api/auth/ { proxy_pass http://auth-service:8000; }

        location /webhook { proxy_pass http://webhook-listener:8000; }

        location /api/reports {
          auth_request /_auth;
          proxy_pass http://report-service:8000;
        }

        location = /healthz { return 200 "ok\n"; }

        location / { proxy_pass http://frontend:80; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: code-review-system
  labels: { app: gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80, name: http }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: gateway-config }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: code-review-system
spec:
  selector: { app: gateway }
  ports: [{ name: http, port: 80, targetPort: http }]
