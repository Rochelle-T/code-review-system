apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-listener
  namespace: code-review-system
  labels: { app: webhook-listener }
spec:
  replicas: 1
  selector: { matchLabels: { app: webhook-listener } }
  template:
    metadata: { labels: { app: webhook-listener } }
    spec:
      containers:
        - name: webhook-listener
          image: codereview/webhook-listener:latest
          imagePullPolicy: Never   # images are built inside minikube (scripts/build-images.sh)
          ports: [{ containerPort: 8000, name: http }]
          envFrom: [{ configMapRef: { name: app-config } }]
          env:
            - name: WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: app-secrets, key: WEBHOOK_SECRET, optional: true } }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 15, periodSeconds: 15 }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-listener
  namespace: code-review-system
  labels: { app: webhook-listener, monitoring: enabled }
spec:
  selector: { app: webhook-listener }
  ports: [{ name: http, port: 8000, targetPort: http }]
